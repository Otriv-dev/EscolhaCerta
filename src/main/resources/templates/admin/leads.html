<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Solicitações recebidas')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><h1>Solicitações recebidas</h1><form class="filter" th:action="@{/admin/leads}" method="get"><label>Filtrar por tipo<select name="kind"><option value="">Todos</option><option value="QUOTE" th:selected="${kind != null and kind.name() == 'QUOTE'}">Orçamentos</option><option value="CAREGIVER" th:selected="${kind != null and kind.name() == 'CAREGIVER'}">Candidaturas</option><option value="CONTACT" th:selected="${kind != null and kind.name() == 'CONTACT'}">Contatos</option><option value="CUSTOM" th:selected="${kind != null and kind.name() == 'CUSTOM'}">Formulários personalizados</option></select></label><button class="button" type="submit">Filtrar</button></form><div class="panel"><p th:if="${page.empty}">Nenhuma solicitação encontrada.</p><div class="inbox-row" th:each="l:${page.content}"><div><strong th:text="${l.name}"></strong><p><span th:text="${l.kind.label}"></span> · <span th:text="${l.email}"></span></p></div><span class="badge" th:text="${l.status.label}"></span><a class="text-link" th:href="@{/admin/leads/{id}(id=${l.id})}">Abrir ↗</a></div></div><div class="actions pagination"><a th:if="${page.hasPrevious()}" th:href="@{/admin/leads(page=${page.number - 1},kind=${kind})}">← Anterior</a><span th:text="'Página '+${page.number + 1}"></span><a th:if="${page.hasNext()}" th:href="@{/admin/leads(page=${page.number + 1},kind=${kind})}">Próxima →</a></div></main></body></html>
