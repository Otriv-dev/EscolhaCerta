<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Editar conteúdo')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><h1>Editar conteúdo</h1><p>Salve como rascunho ou publique para exibir no site.</p><form class="panel" th:action="@{/admin/contents/{kind}/save(kind=${kind})}" th:object="${contentForm}" method="post"><input th:if="${id != null}" type="hidden" name="id" th:value="${id}"><div class="notice error" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label>Título / nome do autor do depoimento<input th:field="*{title}" required maxlength="180"></label><label>Resumo / texto do depoimento<textarea th:field="*{summary}" rows="3" maxlength="500"></textarea></label><label>Texto completo<textarea th:field="*{body}" rows="12" maxlength="30000"></textarea></label><p class="help">O texto é exibido com parágrafos e sem HTML, preservando a segurança do site.</p><label>URL da imagem<input th:field="*{imageUrl}" maxlength="1000" placeholder="https://... ou /media/..."></label><a class="text-link" th:href="@{/admin/media}" target="_blank">Enviar imagem e copiar endereço ↗</a><label>Ordem de exibição<input type="number" th:field="*{sortOrder}" min="0" max="10000"></label><label class="checkbox"><input type="checkbox" th:field="*{published}"><span>Publicado no site</span></label><div class="actions"><button class="button" type="submit">Salvar conteúdo</button><a class="button secondary" th:href="@{/admin/contents/{kind}(kind=${kind})}">Voltar</a></div></form></main></body></html>
