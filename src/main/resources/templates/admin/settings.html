<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Dados da empresa')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><h1>Dados da empresa</h1><p>Esses dados aparecem no contato, rodapé e página “Quem somos”.</p><form class="panel" th:action="@{/admin/settings}" th:object="${settingsForm}" method="post"><div th:if="${#fields.hasAnyErrors()}" class="notice error"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label>E-mail de contato<input type="email" th:field="*{email}" maxlength="180"></label><label>Telefone<input th:field="*{phone}" maxlength="30"></label><label>WhatsApp (DDI + DDD + número, só números)<input th:field="*{whatsapp}" maxlength="15" placeholder="5534999999999"></label><label>Cidade / região de atendimento<input th:field="*{city}" maxlength="120"></label><label>Sobre a empresa<textarea th:field="*{about}" rows="8" maxlength="5000"></textarea></label><button class="button" type="submit">Salvar dados</button></form></main></body></html>
