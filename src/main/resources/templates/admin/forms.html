<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Formulários')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><div class="admin-heading"><div><h1>Formulários personalizados</h1><p>Crie perguntas e receba respostas no painel.</p></div><a class="button" th:href="@{/admin/forms/new}">Criar formulário +</a></div><div class="panel"><p th:if="${items.isEmpty()}">Nenhum formulário cadastrado.</p><div class="inbox-row" th:each="f:${items}"><strong th:text="${f.title}"></strong><span class="badge" th:text="${f.published ? 'Publicado' : 'Rascunho'}"></span><a th:href="@{/formularios/{id}(id=${f.id})}" th:if="${f.published}" target="_blank">Abrir ↗</a><a th:href="@{/admin/forms/{id}/edit(id=${f.id})}">Editar</a><form class="delete-form" th:action="@{/admin/forms/{id}/delete(id=${f.id})}" method="post"><button class="danger">Excluir</button></form></div></div></main></body></html>
