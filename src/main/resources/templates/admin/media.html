<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Enviar imagem')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><h1>Imagens do site</h1><p>Envie uma imagem e copie o endereço para a publicação ou serviço.</p><div class="panel"><form th:action="@{/admin/media}" method="post" enctype="multipart/form-data"><label>Imagem PNG ou JPEG, até 5 MB<input type="file" name="file" accept="image/png,image/jpeg" required></label><button class="button" type="submit">Enviar imagem</button></form><div th:if="${uploadedUrl}"><label>Endereço da imagem<input id="upload-url" th:value="${uploadedUrl}" readonly></label><button id="copy-url" type="button" class="button secondary">Copiar endereço</button><img class="upload-preview" th:src="${uploadedUrl}" alt="Imagem enviada"></div></div></main></body></html>
