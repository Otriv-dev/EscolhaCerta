<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Gerenciar conteúdo')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><div class="admin-heading"><div><span class="eyebrow">GERENCIAR CONTEÚDO</span><h1 th:text="${kind.name() == 'POST' ? 'Publicações' : (kind.name() == 'SERVICE' ? 'Serviços' : 'Depoimentos')}"></h1></div><a class="button" th:href="@{/admin/contents/{kind}/new(kind=${kind})}">Adicionar conteúdo +</a></div><div class="panel"><p th:if="${items.isEmpty()}">Nenhum conteúdo cadastrado.</p><div class="inbox-row" th:each="item:${items}"><div><strong th:text="${item.title}"></strong><p th:text="${item.summary}"></p></div><span class="badge" th:text="${item.published ? 'Publicado' : 'Rascunho'}"></span><a class="text-link" th:href="@{/admin/contents/{kind}/{id}/edit(kind=${kind},id=${item.id})}">Editar</a><form class="delete-form" th:action="@{/admin/contents/{kind}/{id}/delete(kind=${kind},id=${item.id})}" method="post"><button class="danger" type="submit">Excluir</button></form></div></div></main></body></html>
