<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalhes da solicitação')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><a class="text-link" th:href="@{/admin/leads}">← Todas as solicitações</a><h1 th:text="${lead.name}"></h1><div class="panel"><dl class="details"><dt>Tipo</dt><dd th:text="${lead.kind.label}"></dd><dt>Recebido em</dt><dd th:text="${@displayFormat.dateTime(lead.createdAt)}"></dd><dt>E-mail</dt><dd><a th:href="'mailto:'+${lead.email}" th:text="${lead.email}"></a></dd><dt>Telefone</dt><dd th:text="${lead.phone}"></dd><dt>Cidade</dt><dd th:text="${lead.city}"></dd><dt>Mensagem</dt><dd class="preserve" th:text="${lead.message}"></dd><dt th:if="${lead.details}">Respostas adicionais</dt><dd class="preserve" th:if="${lead.details}" th:text="${@displayFormat.answers(lead.details)}"></dd><dt>Autorização de uso dos dados</dt><dd th:text="${lead.consent ? 'Registrada no envio' : 'Não registrada'}"></dd></dl><form class="filter" th:action="@{/admin/leads/{id}/status(id=${lead.id})}" method="post"><label>Status<select name="status"><option th:each="s:${T(br.com.escolhacerta.model.LeadStatus).values()}" th:value="${s}" th:text="${s.label}" th:selected="${s == lead.status}"></option></select></label><button class="button" type="submit">Atualizar status</button></form><form class="delete-form" th:action="@{/admin/leads/{id}/delete(id=${lead.id})}" method="post"><button class="danger" type="submit">Excluir dados desta solicitação</button></form></div></main></body></html>
