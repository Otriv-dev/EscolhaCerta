<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Editar formulário')}"></head><body class="admin-layout"><aside th:replace="~{fragments/layout :: adminNav}"></aside><main class="admin-main"><div th:replace="~{fragments/layout :: messages}"></div><h1>Editar formulário</h1><p>Adicione perguntas com o editor abaixo. Nome, e-mail, telefone, cidade e mensagem já fazem parte do formulário.</p><form class="panel" th:action="@{/admin/forms/save}" th:object="${formDto}" method="post"><input th:if="${id != null}" type="hidden" name="id" th:value="${id}"><div th:if="${#fields.hasAnyErrors()}" class="notice error"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label>Título<input th:field="*{title}" required maxlength="180"></label><label>Descrição<textarea th:field="*{description}" maxlength="500" rows="3"></textarea></label><div id="form-builder"><h2>Perguntas</h2><div id="builder-fields"></div><button class="button secondary" type="button" id="add-field">Adicionar pergunta +</button></div><label class="json-field">Definição dos campos<textarea id="fieldsJson" th:field="*{fieldsJson}" rows="7" required></textarea></label><label class="checkbox"><input type="checkbox" th:field="*{published}"><span>Publicado (aparece no rodapé do site)</span></label><div class="actions"><button class="button" type="submit">Salvar formulário</button><a class="button secondary" th:href="@{/admin/forms}">Voltar</a></div></form></main></body></html>
