<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Acesso administrativo')}"></head><body><a class="skip-link" href="#main">Pular para conteúdo</a><header th:replace="~{fragments/layout :: header}"></header><main id="main"><section class="section login-wrap"><div class="form-card"><span class="eyebrow">ÁREA ADMINISTRATIVA</span><h1>Bem-vindo de volta.</h1><p>Entre para gerenciar o site e os atendimentos.</p><p th:if="${param.error}" class="notice error">E-mail ou senha inválidos.</p><p th:if="${param.logout}" class="notice success">Você saiu da conta.</p><p th:if="${param.passwordChanged}" class="notice success">Senha alterada. Entre novamente com a nova senha.</p><form th:action="@{/login}" method="post"><label>E-mail<input type="email" name="username" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Entrar no painel ↗</button></form></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
