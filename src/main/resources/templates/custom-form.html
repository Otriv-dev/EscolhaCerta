<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Formulário')}"></head><body><a class="skip-link" href="#main">Pular para conteúdo</a><header th:replace="~{fragments/layout :: header}"></header><main id="main"><section class="page-heading"><span class="eyebrow">FALE COM A ESCOLHA CERTA</span><h1 th:text="${custom.title}"></h1><p th:text="${custom.description}"></p></section><section class="section"><div class="form-card"><div th:replace="~{fragments/layout :: messages}"></div><form th:action="@{/formularios/{id}(id=${custom.id})}" th:object="${leadForm}" method="post"><div th:replace="~{fragments/form :: leadFields}"></div><div th:each="f:${fields}" class="dynamic-field"><label th:for="${f.name}" th:text="${f.label}"></label><textarea th:if="${f.type == 'textarea'}" th:id="${f.name}" th:name="${f.name}" th:required="${f.required}" th:text="${answers[f.name]}" maxlength="2000" rows="4"></textarea><select th:if="${f.type == 'select'}" th:id="${f.name}" th:name="${f.name}" th:required="${f.required}"><option value="">Selecione</option><option th:each="o:${f.options}" th:value="${o}" th:text="${o}" th:selected="${o == answers[f.name]}"></option></select><input th:if="${f.type != 'textarea' and f.type != 'select'}" th:id="${f.name}" th:name="${f.name}" th:type="${f.type}" th:required="${f.required}" th:value="${answers[f.name]}" maxlength="2000" step="any"></div><div th:replace="~{fragments/form :: consent}"></div></form></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
