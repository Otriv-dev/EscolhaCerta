<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Serviços e conteúdos')}"></head><body><a class="skip-link" href="#main">Pular para conteúdo</a><header th:replace="~{fragments/layout :: header}"></header><main id="main"><section class="page-heading"><span class="eyebrow">ESCOLHA CERTA</span><h1 th:text="${title}"></h1><p>Presença, informação e acolhimento para apoiar sua rotina.</p></section><section class="section"><p class="empty" th:if="${items.isEmpty()}">Novos conteúdos serão publicados em breve.</p><div class="cards"><article class="card" th:each="item:${items}"><img class="card-image" th:if="${!#strings.isEmpty(item.imageUrl)}" th:src="${item.imageUrl}" th:alt="${item.title}"><h2 th:text="${item.title}"></h2><p th:text="${item.summary}"></p><p class="preserve" th:if="${kind.name() == 'SERVICE'}" th:text="${item.body}"></p><a th:if="${kind.name() == 'POST'}" class="text-link" th:href="@{/blog/{id}(id=${item.id})}">Ler publicação ↗</a><a th:if="${kind.name() == 'SERVICE'}" class="button secondary" th:href="@{/orcamento}">Solicitar orçamento</a></article></div><nav class="actions pagination" aria-label="Paginação"><a th:if="${resultPage.hasPrevious()}" th:href="@{${listingPath}(page=${resultPage.number - 1})}">← Anterior</a><span th:text="'Página ' + ${resultPage.number + 1}"></span><a th:if="${resultPage.hasNext()}" th:href="@{${listingPath}(page=${resultPage.number + 1})}">Próxima →</a></nav></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
