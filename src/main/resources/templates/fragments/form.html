<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="leadFields"><div th:if="${#fields.hasAnyErrors()}" class="notice error" role="alert"><p>Revise os campos indicados.</p><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="field-grid"><label>Seu nome<input th:field="*{name}" required maxlength="120" autocomplete="name"></label><label>E-mail<input type="email" th:field="*{email}" required maxlength="180" autocomplete="email"></label><label>Telefone / WhatsApp<input type="tel" th:field="*{phone}" required maxlength="30" autocomplete="tel" placeholder="(34) 99999-9999"></label><label>Cidade / região<input th:field="*{city}" maxlength="120" autocomplete="address-level2"></label></div><label>Conte sobre sua necessidade ou experiência<textarea th:field="*{message}" rows="6" required maxlength="5000" placeholder="Descreva os horários, o tipo de cuidado ou sua experiência profissional."></textarea></label><label class="honeypot" aria-hidden="true">Website<input th:field="*{website}" tabindex="-1" autocomplete="off"></label></div><div th:fragment="consent"><label class="checkbox"><input type="checkbox" th:field="*{consent}" required><span>Autorizo o uso dos dados enviados para responder a esta solicitação, conforme a <a th:href="@{/privacidade}">política de privacidade</a>.</span></label><button class="button" type="submit">Enviar informações ↗</button></div></body></html>
